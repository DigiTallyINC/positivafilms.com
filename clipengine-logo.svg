<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&amp;family=Syne:wght@700&amp;display=swap');
    </style>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7AB5FF"/>
      <stop offset="100%" style="stop-color:#539dff"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#232a34"/>
      <stop offset="100%" style="stop-color:#0e1116"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Icon Background -->
  <rect x="12" y="12" width="96" height="96" rx="18" fill="url(#frameGrad)" stroke="#2A323E" stroke-width="1.5"/>

  <!-- Film strip perforations - left -->
  <rect x="18" y="22" width="10" height="7" rx="2" fill="#0e1116"/>
  <rect x="18" y="37" width="10" height="7" rx="2" fill="#0e1116"/>
  <rect x="18" y="52" width="10" height="7" rx="2" fill="#0e1116"/>
  <rect x="18" y="67" width="10" height="7" rx="2" fill="#0e1116"/>
  <rect x="18" y="82" width="10" height="7" rx="2" fill="#0e1116"/>
  <rect x="18" y="97" width="10" height="7" rx="2" fill="#0e1116"/>

  <!-- Film strip perforations - right -->
  <rect x="92" y="22" width="10" height="7" rx="2" fill="#0e1116"/>
  <rect x="92" y="37" width="10" height="7" rx="2" fill="#0e1116"/>
  <rect x="92" y="52" width="10" height="7" rx="2" fill="#0e1116"/>
  <rect x="92" y="67" width="10" height="7" rx="2" fill="#0e1116"/>
  <rect x="92" y="82" width="10" height="7" rx="2" fill="#0e1116"/>
  <rect x="92" y="97" width="10" height="7" rx="2" fill="#0e1116"/>

  <!-- Film strip rails -->
  <rect x="30" y="12" width="60" height="96" rx="0" fill="#1c222c"/>

  <!-- Play triangle -->
  <polygon points="50,42 50,78 80,60" fill="url(#accentGrad)" filter="url(#glow)"/>

  <!-- Neural dots on play button -->
  <circle cx="50" cy="42" r="3" fill="#7AB5FF" opacity="0.9"/>
  <circle cx="50" cy="78" r="3" fill="#539dff" opacity="0.9"/>
  <circle cx="80" cy="60" r="3.5" fill="#7AB5FF" opacity="1"/>

  <!-- Connector lines (neural) -->
  <line x1="50" y1="42" x2="65" y2="52" stroke="#7AB5FF" stroke-width="0.8" opacity="0.4"/>
  <line x1="50" y1="78" x2="65" y2="68" stroke="#539dff" stroke-width="0.8" opacity="0.4"/>

  <!-- WORDMARK — single element with locked width so AI badge never overlaps -->
  <text x="126" y="56"
        font-family="'Syne', 'Arial Black', sans-serif"
        font-weight="700"
        font-size="36"
        letter-spacing="-0.5"
        fill="#E8EAED"
        textLength="205"
        lengthAdjust="spacingAndGlyphs">ClipEngine</text>

  <!-- AI badge — always starts 12px after guaranteed text end (126+205+12=343) -->
  <rect x="343" y="31" width="34" height="19" rx="5" fill="url(#accentGrad)" opacity="0.15"/>
  <rect x="343" y="31" width="34" height="19" rx="5" fill="none" stroke="url(#accentGrad)" stroke-width="1"/>
  <text x="360" y="44"
        font-family="'DM Mono', monospace"
        font-weight="500"
        font-size="11"
        fill="url(#accentGrad)"
        text-anchor="middle"
        letter-spacing="1">AI</text>

  <!-- Tagline -->
  <text x="126" y="79"
        font-family="'DM Mono', monospace"
        font-size="11"
        fill="#7A8290"
        letter-spacing="2"
        textLength="215"
        lengthAdjust="spacingAndGlyphs">GENERATE. REVIEW. SUBMIT.</text>

  <!-- Divider line — spans from wordmark start to badge right edge -->
  <line x1="126" y1="86" x2="381" y2="86" stroke="url(#accentGrad)" stroke-width="0.3" opacity="0.3"/>
</svg>
